<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Từ vựng</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1b1f24;--muted:#5f6b7a;--line:#dfe4ec;--pri:#1f6feb;--ok:#1a7f37;--ng:#cf222e;--soft:#eaf1ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--text:#e6edf3;--muted:#8b97a6;--line:#2a323d;--pri:#4c8dff;--ok:#3fb950;--ng:#f85149;--soft:#1c2a40}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px calc(6px);padding-top:max(10px,env(safe-area-inset-top))}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:18px;margin:0;flex:1}
select,input[type=search]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
nav{display:flex;gap:4px;margin-top:8px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:8px 4px;border-radius:10px}
nav button.on{background:var(--soft);color:var(--pri);font-weight:600}
main{max-width:640px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 14px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ng{background:var(--ng);border-color:var(--ng);color:#fff}
.btn:disabled{opacity:.5}
.grow{flex:1}
.stack>*+*{margin-top:12px}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.word{font-size:32px;font-weight:700;word-break:break-word}
.type{color:var(--pri);font-style:italic;margin-top:4px}
.mean{font-size:20px;margin-top:14px;white-space:pre-line}
.ctx{margin-top:12px;color:var(--muted);font-style:italic;white-space:pre-line}
.speak{border:0;background:none;font-size:22px;cursor:pointer;color:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin-top:8px;white-space:pre-line}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 15%,var(--card))}
.list .it{padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.box{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;background:var(--soft);color:var(--pri);margin-left:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center}
.msg{white-space:pre-line}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>📘 Từ vựng</h1>
    <select id="deck" aria-label="Chọn bộ từ"></select>
  </div>
  <nav>
    <button data-tab="learn" class="on">Học</button>
    <button data-tab="quiz">Kiểm tra</button>
    <button data-tab="list">Danh sách</button>
    <button data-tab="import">Nhập file</button>
  </nav>
</header>
<main id="view"></main>
<script src="app.js"></script>
</body>
</html>
